[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "respay"
version = "0.1.0"
description = "Reproducible ResPay reimbursement-standard prediction research code"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["respay*"]

[tool.setuptools.package-data]
"respay.data" = ["samples/README.md", "samples/dip/*.csv", "samples/drg/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["respay", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
